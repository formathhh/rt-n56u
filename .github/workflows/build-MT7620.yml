name: Build MT7620

on: 
  workflow_dispatch:  # 支持手动运行
  push:               # 推送时触发
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-MT7620.yml'
      - 'trunk/**'
  release:
    types: [published]
  schedule:
    - cron: '0 17 * * 4'  # 每周四17:00

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120  # 添加超时

    steps:
    - name: Checkout
      uses: actions/checkout@v4  # 使用v4
      with:
        submodules: recursive
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install \
          unzip \
          libtool-bin \
          curl \
          cmake \
          gperf \
          gawk \
          flex \
          bison \
          nano \
          xxd \
          fakeroot \
          cpio \
          git \
          python3 \
          python3-docutils \
          gettext \
          automake \
          autopoint \
          texinfo \
          build-essential \
          help2man \
          pkg-config \
          zlib1g-dev \
          libgmp-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses5-dev \
          libltdl-dev \
          wget \
          rsync \
          device-tree-compiler
        
    - name: Install Go for Padavan
      run: |
        wget -q https://go.dev/dl/go1.20.12.linux-amd64.tar.gz
        sudo tar -C /usr/local -xzf go1.20.12.linux-amd64.tar.gz
        rm go1.20.12.linux-amd64.tar.gz
        echo "GOROOT=/usr/local/go" >> $GITHUB_ENV
        echo "GOPATH=/home/runner/go" >> $GITHUB_ENV
        echo "PATH=/usr/local/go/bin:$PATH" >> $GITHUB_ENV
        
    - name: Clone source code
      run: |
        cd toolchain-mipsel
        chmod +x dl_toolchain.sh
        ./dl_toolchain.sh
        mkdir -p /opt/images/
        
    - name: Verify environment
      run: |
        echo "环境检查:"
        go version
        python3 --version
        gcc --version | head -1
        
    - name: Build Firmware
      env:
        TNAME: "NEWIFI-MINI MI-MINI MI-3 OYE-001 YK-L1 JCG-AC836M 5K-W20"
      run: |
        cwd=`pwd`
        CONFIG_TOOLCHAIN_DIR=${cwd//\//\\\/}\\/toolchain-mipsel
        cd trunk
        for m in $TNAME;
        do
        if [ ! -f configs/templates/$m.config ] ; then
        echo "configs/templates/$m.config not found "
        exit 1
        fi
        cp -f configs/templates/$m.config .config
        #####################################################################################
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config #删除配置项MENTOHUST
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config #删除配置项SCUTCLIENT
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config #删除配置项SS plus+
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config #删除配置项SS server
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config #删除配置项DNSFORWARDER
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config #删除配置项adbyby plus+
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config #删除配置项adbyby plus+
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config #删除配置项adbyby plus+
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config #删除配置项adbyby plus+
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config #删除配置项阿里DDNS
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
        ######################################################################
        echo "CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n" >> .config #MENTOHUST
        echo "CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n" >> .config #SCUTCLIENT
        echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y" >> .config #SS plus+
        echo "CONFIG_FIRMWARE_INCLUDE_SSSERVER=n" >> .config #SS server
        echo "CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n" >> .config #DNSFORWARDER
        echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=n" >> .config #adbyby plus+
        echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config #内网穿透FRPC
        echo "CONFIG_FIRMWARE_INCLUDE_FRPS=n" >> .config #内网穿透FRPS
        echo "CONFIG_FIRMWARE_INCLUDE_TUNSAFE=n" >> .config #TUNSAFE
        echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=n" >> .config #阿里DDNS
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y" >> .config #smartdns
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y" >> .config #smartdns二进制文件
        echo "CONFIG_FIRMWARE_INCLUDE_V2RAY=y" >> .config #v2ray二进制文件
        echo "CONFIG_FIRMWARE_INCLUDE_TROJAN=y" >> .config #集成trojan执行文件
        echo "CONFIG_FIRMWARE_INCLUDE_KOOLPROXY=n" >> .config #KP广告过滤
        echo "CONFIG_FIRMWARE_INCLUDE_CADDY=y" >> .config #在线文件管理服务
        echo "CONFIG_FIRMWARE_INCLUDE_CADDYBIN=n" >> .config #集成caddy执行文件，此文件有13M
        echo "CONFIG_FIRMWARE_INCLUDE_KUMASOCKS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ADGUARDHOME=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_IPT2SOCKS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MICROSOCKS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SRELAY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_WYY=n" >> .config #网易云解锁
        echo "CONFIG_FIRMWARE_INCLUDE_WYYBIN=n" >> .config #网易云解锁GO版本执行文件
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config #zerotier ~1.3M
        ####################################################################################
        echo "CONFIG_FIRMWARE_INCLUDE_TTYD=n" >> .config
        sed -i "s/^CONFIG_TOOLCHAIN_DIR=.*$/CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}/g" .config
        sudo ./clear_tree_simple
        sudo ./build_firmware_modify $m 0
        sudo mv -f images/*.trx /opt/images/
        done
        
    - name: Check firmware size
      run: |
        echo "固件大小检查:"
        ls -lh /opt/images/*.trx
        for f in /opt/images/*.trx; do
          size=$(stat -c%s "$f")
          size_mb=$((size / 1048576))
          echo "$(basename $f): ${size_mb}MB"
          if [ $size_mb -gt 8 ]; then
            echo "警告: $(basename $f) 超过8MB，优酷L1可能无法刷入"
          fi
        done
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1  # ✅ 正确的release action
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: autobuild-${{ github.run_number }}
        name: "Padavan MT7620 Build #${{ github.run_number }}"
        body: |
          ## Padavan固件自动编译
          
          **编译信息:**
          - 工作流运行: #${{ github.run_number }}
          - 编译时间: ${{ github.event.head_commit.timestamp }}
          - 提交哈希: ${{ github.sha }}
          
          **包含设备:**
          - NEWIFI-MINI
          - MI-MINI
          - MI-3
          - OYE-001
          - YK-L1 (优酷路由宝)
          - JCG-AC836M
          - 5K-W20
          
          **注意事项:**
          1. 选择对应设备的固件刷入
          2. 首次启动建议恢复出厂设置
          3. 检查固件大小，确保设备Flash足够
        files: /opt/images/*.trx
        draft: false
        prerelease: true
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4  # ✅ 使用v4
      with:
        name: firmware-all-mt7620
        path: /opt/images/
        retention-days: 7
